name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Wait for Docker workflow to build and push multi-platform images
  wait-for-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Docker workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.ref }}
          check-name: docker
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  extract-linux-binary:
    needs: wait-for-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract binary from Docker image
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/someblackmagic/vault-manager:${TAG}"
          docker create --name extract --platform linux/amd64 "${IMAGE}"
          docker cp extract:/usr/local/bin/vault-manager vault-manager-linux-amd64
          docker rm extract
          tar czf vault-manager-linux-amd64.tar.gz vault-manager-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vault-manager-linux-amd64
          path: vault-manager-linux-amd64.tar.gz

  build-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
            ext: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -v \
            -trimpath \
            -mod=readonly \
            -buildvcs=false \
            -tags netgo,osusergo,timetzdata \
            -pgo=auto \
            -ldflags "-s -w -buildid= \
                      -extldflags '-static' \
                      -X 'main.Version=${{ github.ref_name }}' \
                      -X 'main.Revision=${{ github.sha }}'" \
            -o vault-manager-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      - name: Create archive
        run: |
          BINARY="vault-manager-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip "${BINARY}.zip" "${BINARY}"
          else
            tar czf "vault-manager-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "${BINARY}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vault-manager-${{ matrix.goos }}-${{ matrix.goarch }}
          path: vault-manager-${{ matrix.goos }}-${{ matrix.goarch }}.*

  create-release:
    needs: [extract-linux-binary, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*