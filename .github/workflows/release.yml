name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
            ext: .exe
          - goos: windows
            goarch: arm64
            archive: zip
            ext: .exe
          - goos: freebsd
            goarch: amd64
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Build binary
        run: |
          SOURCE_DATE_EPOCH=0 \
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -v \
            -trimpath \
            -mod=readonly \
            -buildvcs=false \
            -tags netgo,osusergo,timetzdata \
            -pgo=auto \
            -ldflags "-s -w -buildid= \
                      -extldflags '-static' \
                      -X 'main.Version=${{ github.ref_name }}' \
                      -X 'main.Revision=${{ github.sha }}'" \
            -o vault-manager-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      - name: Create archive
        run: |
          BINARY="vault-manager-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip "${BINARY}.zip" "${BINARY}"
          else
            tar czf "vault-manager-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "${BINARY}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vault-manager-${{ matrix.goos }}-${{ matrix.goarch }}
          path: vault-manager-${{ matrix.goos }}-${{ matrix.goarch }}.*

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*