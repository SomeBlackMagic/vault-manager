name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Wait for Docker workflow to build and push multi-platform images
  wait-for-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Docker workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.ref }}
          check-name: docker
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  extract-binaries:
    needs: wait-for-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Extract binary
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/someblackmagic/vault-manager:${TAG}"
          docker create --name extract --platform "linux/${{ matrix.arch }}" "${IMAGE}"
          docker cp extract:/usr/local/bin/vault-manager vault-manager-linux-${{ matrix.arch }}
          docker rm extract
          tar czf vault-manager-linux-${{ matrix.arch }}.tar.gz vault-manager-linux-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vault-manager-linux-${{ matrix.arch }}
          path: vault-manager-linux-${{ matrix.arch }}.tar.gz

  build-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Build Windows binary
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -trimpath \
            -ldflags "-s -w -X 'main.Version=${{ github.ref_name }}' -X 'main.Revision=${{ github.sha }}'" \
            -o vault-manager-windows-amd64.exe .
          zip vault-manager-windows-amd64.zip vault-manager-windows-amd64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vault-manager-windows-amd64
          path: vault-manager-windows-amd64.zip

  create-release:
    needs: [extract-binaries, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*